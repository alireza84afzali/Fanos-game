<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جنگل فانوس - نسخه پیشرفته</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#110e1b;--fg:#f1e6cc;--card:#1c1730;--accent:#f2b24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:10px 12px;box-sizing:border-box;overflow:hidden}
#hud{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;padding:2px 4px 10px}
#hud span b{font-weight:800;font-size:16px;color:var(--accent)}
#barw{flex:1;height:8px;border-radius:8px;background:var(--card);overflow:hidden}
#bar{height:100%;width:100%;background:var(--accent);border-radius:8px;transition:width .1s linear}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;line-height:0;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
canvas{touch-action:none;display:block;cursor:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;line-height:1.6;background:rgba(10,7,20,.88);color:#f7ecd3}
#ov[hidden]{display:none}
#ttl{margin:0;font-size:28px;font-weight:800;letter-spacing:0;color:var(--accent)}
#txt{margin:0;font-size:14px;max-width:340px}
.btn-group{display:flex;flex-direction:column;gap:8px;width:100%;max-width:240px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;color:#1a1224;background:var(--accent);padding:10px 24px;font-size:15px;transition:transform .1s, filter .1s}
button:hover{filter:brightness(1.1);transform:scale(1.02)}
button:active{transform:scale(0.98)}
.btn-sec{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 2px var(--accent)}
#foot{display:flex;justify-content:center;padding-top:10px}
#pulse{background:var(--card);color:var(--fg);padding:10px 28px;font-size:15px;box-shadow:inset 0 0 0 2px var(--accent)}
#pulse.cool{opacity:.5}
</style>
</head>
<body>
<div id="hud">
  <span><b id="hud-lbl">کرم:</b> <b id="sc">۰</b></span>
  <div id="barw"><div id="bar"></div></div>
  <span>رکورد: <b id="bs">۰</b></span>
</div>
<div id="stage">
  <div id="frame">
    <canvas id="c"></canvas>
    <div id="ov">
      <h1 id="ttl">جنگل فانوس</h1>
      <p id="txt">به جنگل تاریک خوش آمدید. حالت بازی خود را انتخاب کنید:</p>
      <div id="menu-box" class="btn-group">
        <button onclick="setMode('levels')">موج سطوح (آسان/متوسط/سخت)</button>
        <button onclick="setMode('endless')" class="btn-sec">حالت رکوردی (بی‌پایان)</button>
        <button onclick="setMode('stages')" class="btn-sec">حالت مرحله‌ای (آبشاری)</button>
      </div>
      <div id="sub-menu-box" class="btn-group" style="display:none">
        <button id="m-btn1" onclick="startPlay(1)">آسان</button>
        <button id="m-btn2" onclick="startPlay(2)" class="btn-sec">متوسط</button>
        <button id="m-btn3" onclick="startPlay(3)" class="btn-sec">سخت</button>
        <button onclick="backToMenu()" class="btn-sec" style="font-size:13px;padding:6px">بازگشت</button>
      </div>
    </div>
  </div>
</div>
<div id="foot"><button id="pulse">انفجار</button></div>

<script>
(()=>{
const W=480,H=640,cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
const ov=$('ov'),ttl=$('ttl'),txt=$('txt'),sc=$('sc'),bs=$('bs'),bar=$('bar'),pb=$('pulse');
const menuBox=$('menu-box'),subMenuBox=$('sub-menu-box'),hudLbl=$('hud-lbl');
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),fa=n=>n.toLocaleString('fa-IR');

let MAXL=190,MINL=26;
let best=0;try{best=+localStorage.getItem('lf_best2')||0}catch(e){}
bs.textContent=fa(best);

let S='menu',gameMode='levels',diff=1,stageNum=1,stageTimer=0,stageTarget=30;
let p,flies,shades,parts,score,t=0,light,spawn,cd,pulse,shake,mouse={x:W/2,y:H*.7,on:false},keys={};

const themes={
  0:{pCol:'110, 228, 255', sCol:'rgba(100,220,255,.8)', shCol:'#15222b', name:'رکوردی'},
  1:{pCol:'86, 255, 170', sCol:'rgba(80,220,150,.8)', shCol:'#162822', name:'آسان'},
  2:{pCol:'255, 223, 108', sCol:'rgba(255,200,100,.8)', shCol:'#2b2015', name:'متوسط'},
  3:{pCol:'255, 110, 110', sCol:'rgba(255,100,100,.8)', shCol:'#2b1515', name:'سخت'},
  4:{pCol:'223, 142, 255', sCol:'rgba(220,100,255,.8)', shCol:'#25152b', name:'مرحله‌ای'}
};

const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(()=>{const b=bg.getContext('2d');
const gr=b.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#151026');gr.addColorStop(1,'#070f14');
b.fillStyle=gr;b.fillRect(0,0,W,H);
for(let i=0;i<120;i++){b.fillStyle='rgba(255,245,210,'+rnd(.1,.7)+')';b.fillRect(rnd(0,W),rnd(0,H*.6),rnd(1,2.5),rnd(1,2.5))}
const cols=['#120e22','#0d1720','#071015'];
for(let l=0;l<3;l++){b.fillStyle=cols[l];
 for(let i=0;i<12;i++){const x=rnd(-20,W+20),h=rnd(100,180)+l*35,y=rnd(200,H+20),w=h*.32;
  for(let k=0;k<3;k++){const yy=y-k*h*.26,s=1-k*.2;b.beginPath();b.moveTo(x,yy-h*.42);b.lineTo(x-w*s,yy);b.lineTo(x+w*s,yy);b.fill()}}}
})();

function glow(x,y,r,c,a){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'rgba('+c+','+a+')');q.addColorStop(1,'rgba('+c+',0)');g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(30,160),l=rnd(.4,.9);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l,m:l,c})}}
function addFly(){flies.push({x:rnd(30,W-30),y:rnd(60,H-50),ph:rnd(0,6.28),s:rnd(.6,1.4)})}
function addShade(){
  const a=Math.floor(rnd(0,4));let x,y;
  if(a===0){x=rnd(0,W);y=-25}else if(a===1){x=W+25;y=rnd(0,H)}else if(a===2){x=rnd(0,W);y=H+25}else{x=-25;y=rnd(0,H)}
  let type=Math.floor(rnd(0,3));
  shades.push({x,y,ph:rnd(0,6),type,speedMul:rnd(0.8,1.2)})
}

window.setMode=function(m){
  gameMode=m;
  if(m==='endless'){
    startPlay(0);
  }else if(m==='stages'){
    stageNum=1;
    startPlay(4);
  }else{
    menuBox.style.display='none';
    subMenuBox.style.display='flex';
    ttl.textContent='انتخاب سطح سختی';
    txt.textContent='سطح چالش بازی را انتخاب کنید:';
  }
}

window.backToMenu=function(){
  menuBox.style.display='flex';
  subMenuBox.style.display='none';
  ttl.textContent='جنگل فانوس';
  txt.textContent='به جنگل تاریک خوش آمدید. حالت بازی خود را انتخاب کنید:';
}

function reset(){
  p={x:W/2,y:H*.72};light=150;score=0;t=0;spawn=2;cd=0;pulse=null;shake=0;flies=[];shades=[];parts=[];
  for(let i=0;i<6;i++)addFly();
  if(gameMode==='stages'){
    stageTimer=0;
    stageTarget=35+stageNum*15;
    hudLbl.textContent='مرحله '+fa(stageNum)+':';
  }else{
    hudLbl.textContent='کرم:';
  }
  hud();
}

window.startPlay=function(d){
  diff=d;
  reset();
  S='play';
  ov.hidden=true;
}

function hud(){
  if(gameMode==='stages'){
    sc.textContent=fa(Math.max(0,Math.ceil(stageTarget-stageTimer)))+' ثانیه';
  }else{
    sc.textContent=fa(score);
  }
  bar.style.width=cl((light-MINL)/(MAXL-MINL),0,1)*100+'%';
  pb.className=cd>0?'cool':'';
  pb.textContent=cd>0?'انفجار ('+fa(Math.ceil(cd))+')':'انفجار';
}

function doPulse(){if(S==='play'&&cd<=0){pulse={x:p.x,y:p.y,r:0};cd=diff===3?6:4}}

function over(win=false){
  S='over';
  const rec=score>best&&score>0;
  if(rec){best=score;try{localStorage.setItem('lf_best2',best)}catch(e){}}
  bs.textContent=fa(best);
  ttl.textContent='نورت خاموش شد 🕯️';
  txt.textContent=gameMode==='stages'?'در مرحله '+fa(stageNum)+' متوقف شدی.':'امشب '+fa(score)+' کرم شب‌تاب جمع کردی'+(rec?' و رکورد جدید ثبت شد!':'.');
  ov.hidden=false;
  menuBox.style.display='flex';
  subMenuBox.style.display='none';
}

function step(dt){
 t+=dt;
 if(gameMode==='stages'){
   stageTimer+=dt;
   if(stageTimer>=stageTarget){
     stageNum++;
     stageTimer=0;
     stageTarget+=15;
     hudLbl.textContent='مرحله '+fa(stageNum)+':';
     burst(p.x,p.y,30,'220,100,255');
     light=Math.min(MAXL,light+50);
   }
 }

 const spd=diff===3?290:(diff===2?260:230);
 const dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
 if(dx||dy){const m=Math.hypot(dx,dy);p.x+=dx/m*spd*dt;p.y+=dy/m*spd*dt;mouse.on=false}
 else if(mouse.on){const k=Math.min(1,dt*8);p.x+=(mouse.x-p.x)*k;p.y+=(mouse.y-p.y)*k}
 p.x=cl(p.x,16,W-16);p.y=cl(p.y,16,H-16);

 const drainRate=diff===3?7.5:(diff===2?6:(gameMode==='stages'?5.5+stageNum*.4:5));
 light-=dt*(drainRate+Math.min(score,50)*.15);

 for(const f of flies){
   f.ph+=dt*f.s;f.x=cl(f.x+Math.sin(f.ph*1.3)*16*dt,16,W-16);f.y=cl(f.y+Math.cos(f.ph)*16*dt,16,H-16);
   if(Math.hypot(f.x-p.x,f.y-p.y)<26){f.dead=1;score++;light=Math.min(MAXL,light+18);burst(f.x,f.y,12,'255,214,120')}
 }
 flies=flies.filter(f=>!f.dead);while(flies.length<(gameMode==='stages'?5+stageNum:6))addFly();

 spawn-=dt;
 const spawnTime=Math.max(0.5, (diff===3?1.5:(diff===2?2:2.4)) - (gameMode==='stages'?stageNum*0.12:score*0.03));
 if(spawn<=0){addShade();spawn=spawnTime}

 const shadeSpeed=Math.min(140, (diff===3?65:(diff===2?50:40)) + score*1.8 + (gameMode==='stages'?stageNum*4:0));
 for(const s of shades){
   const a=Math.atan2(p.y-s.y,p.x-s.x);
   s.ph+=dt*5;
   s.x+=Math.cos(a)*shadeSpeed*s.speedMul*dt;
   s.y+=Math.sin(a)*shadeSpeed*s.speedMul*dt;
   if(Math.hypot(s.x-p.x,s.y-p.y)<26){
     s.dead=1;light-= (diff===3?40:(diff===2?32:26));shake=.35;burst(p.x,p.y,18,'200,100,255');
   }
 }

 cd=Math.max(0,cd-dt);
 if(pulse){
   pulse.r+=500*dt;
   for(const s of shades)if(!s.dead&&Math.hypot(s.x-pulse.x,s.y-pulse.y)<pulse.r){s.dead=1;burst(s.x,s.y,14,'255,200,255')}
   if(pulse.r>220)pulse=null;
 }
 shades=shades.filter(s=>!s.dead);

 if(Math.random()<dt*45)parts.push({x:p.x+rnd(-5,5),y:p.y+8,vx:rnd(-10,10),vy:rnd(12,35),l:.6,m:.6,c:'255,200,110'});
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.95;q.vy*=.95;q.l-=dt}
 parts=parts.filter(q=>q.l>0);
 shake=Math.max(0,shake-dt);
 hud();
 if(light<MINL)over(false);
}

function draw(){
 g.save();
 if(shake>0)g.translate(rnd(-4,4)*shake*3,rnd(-4,4)*shake*3);
 g.drawImage(bg,0,0);

 const activeTheme=themes[diff]||themes[1];

 for(const s of shades){
   g.save();
   g.translate(s.x,s.y);
   g.fillStyle=activeTheme.shCol;
   g.strokeStyle=diff===3?'rgba(255,100,100,.85)':'rgba(170,130,255,.75)';
   g.lineWidth=2;

   g.beginPath();
   if(s.type===0){
     for(let i=0;i<=10;i++){const a=i/10*6.283,r=16+Math.sin(a*4+s.ph)*4;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
   }else if(s.type===1){
     for(let i=0;i<=6;i++){const a=i/6*6.283,r=18+Math.cos(a*3+s.ph)*5;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
   }else{
     g.moveTo(0,-20);g.lineTo(18,15);g.lineTo(-18,15);
   }
   g.closePath();g.fill();g.stroke();

   g.fillStyle=diff===3?'#ff3b3b':'#c882ff';
   g.beginPath();
   g.arc(-5,-3,2.8,0,6.283);
   g.arc(5,-3,2.8,0,6.283);
   g.fill();
   g.restore();
 }

 const gr=g.createRadialGradient(p.x,p.y,light*.4,p.x,p.y,light*1.25);
 gr.addColorStop(0,'rgba(4,3,10,0)');gr.addColorStop(1,'rgba(4,3,10,.92)');
 g.fillStyle=gr;g.fillRect(-15,-15,W+30,H+30);

 g.globalCompositeOperation='lighter';
 for(const f of flies)glow(f.x,f.y,20,'255,214,120',.6+.4*Math.sin(f.ph*3));
 for(const q of parts)glow(q.x,q.y,7,q.c,q.l/q.m);
 g.globalCompositeOperation='source-over';

 if(pulse){
   g.strokeStyle='rgba(255,230,160,'+(1-pulse.r/220)+')';
   g.lineWidth=3.5;g.beginPath();g.arc(pulse.x,pulse.y,pulse.r,0,6.283);g.stroke();
 }

 g.globalCompositeOperation='lighter';
 glow(p.x,p.y,52+Math.sin(t*7)*4,activeTheme.pCol,.95);
 g.globalCompositeOperation='source-over';
 g.fillStyle='#ffffff';g.beginPath();g.arc(p.x,p.y,7.5,0,6.283);g.fill();

 g.restore();
}

let last=performance.now();
function loop(n){
 const dt=Math.min(.05,(n-last)/1000);last=n;
 if(S==='play')step(dt);
 else{t+=dt;for(const f of flies)f.ph+=dt*f.s}
 draw();
 requestAnimationFrame(loop);
}

function fit(){const st=$('stage'),s=Math.min(st.clientWidth/W,st.clientHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
function pt(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height-(e.pointerType==='touch'?46:0);mouse.on=true}
cv.addEventListener('pointermove',pt);cv.addEventListener('pointerdown',pt);
addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();if(S==='play')doPulse();return}
 if(e.code.startsWith('Arrow'))e.preventDefault();
 keys[e.code]=1});
addEventListener('keyup',e=>{keys[e.code]=0});
pb.addEventListener('click',doPulse);
addEventListener('resize',fit);
reset();fit();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
